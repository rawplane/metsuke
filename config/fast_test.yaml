# Fast local testing config - minimizes slow network operations
target:
  url: "http://127.0.0.1:8888"
  scope: []
  exclude_paths: []

pipeline:
  stages:
    - "recon"
    - "vulnerability_scan"
    - "security_headers"
    - "auth_testing"
    - "report"
  stop_on_critical: false
  parallel_workers: 5

recon:
  subdomain_enum: false
  port_scan: false
  tech_detection: true
  robots_sitemap: true
  directory_bruteforce: false
  wordlist: "wordlists/directories.txt"

vulnerability_scan:
  sqli: true
  xss: true
  idor: true
  ssrf: true
  lfi: true
  command_injection: true
  xxe: true
  time_threshold: 5
  max_payloads: 50

security_headers:
  check_csp: true
  check_hsts: true
  check_xframe: true
  check_xcontent: true
  check_referrer_policy: true
  check_permissions: true

auth_testing:
  test_session_fixation: false
  test_session_timeout: false
  test_weak_password: true
  test_default_creds: true
  default_creds_file: "wordlists/default_creds.txt"

network:
  delay: 0
  timeout: 3
  max_retries: 1
  user_agent: "Mozilla/5.0 (Pipeline-PenTest/1.0; Security Scanner)"
  verify_ssl: false
  follow_redirects: true
  max_redirects: 3

proxy:
  http: ""
  https: ""

report:
  format: "all"
  output_dir: "output"
  include_evidence: true

logging:
  level: "INFO"
  file: "output/pentest.log"
  console: true
