# ============================================================
# Pipeline Penetration Tester - Configuration File
# ============================================================

# Target configuration
target:
  # Single target URL or list of URLs
  url: "http://testphp.vulnweb.com"
  # Alternatively, provide a file with list of targets
  # url_file: "targets.txt"
  # Scope: restrict testing to these domains/IPs (empty = no restriction)
  scope:
    - "testphp.vulnweb.com"
  # Exclude these paths from scanning
  exclude_paths:
    - "/logout.php"
    - "/admin/logout"

# Pipeline stages configuration
pipeline:
  # Order of execution - stages run sequentially
  stages:
    - "recon"
    - "vulnerability_scan"
    - "security_headers"
    - "auth_testing"
    - "report"

  # Stop on first critical finding (true = stop, false = continue)
  stop_on_critical: false

  # Parallel execution within stages
  parallel_workers: 10

# Reconnaissance settings
recon:
  subdomain_enum: true
  port_scan: true
  port_range: "1-1000"
  tech_detection: true
  robots_sitemap: true
  directory_bruteforce: true
  wordlist: "wordlists/directories.txt"

# Vulnerability scanning settings
vulnerability_scan:
  sqli: true
  xss: true
  idor: true
  ssrf: true
  lfi: true
  rfi: false
  command_injection: true
  xxe: true
  # Time-based SQLi detection threshold (seconds)
  time_threshold: 5
  # Maximum payloads per parameter
  max_payloads: 100

# Security headers check
security_headers:
  check_csp: true
  check_hsts: true
  check_xframe: true
  check_xcontent: true
  check_referrer_policy: true
  check_permissions: true

# Authentication testing
auth_testing:
  test_session_fixation: true
  test_session_timeout: true
  test_weak_password: true
  test_default_creds: true
  default_creds_file: "wordlists/default_creds.txt"

# Rate limiting & politeness
network:
  # Delay between requests (seconds)
  delay: 0.1
  # Timeout per request (seconds)
  timeout: 15
  # Maximum retries
  max_retries: 3
  # User agent
  user_agent: "Mozilla/5.0 (Pipeline-PenTest/1.0; Security Scanner)"
  # Verify SSL certificates
  verify_ssl: false
  # Follow redirects
  follow_redirects: true
  # Max redirects
  max_redirects: 5

# Proxy configuration (empty = no proxy)
proxy:
  http: ""
  https: ""

# Reporting
report:
  format: "all"  # all, html, json, txt
  output_dir: "output"
  include_evidence: true
  severity_order:
    - "critical"
    - "high"
    - "medium"
    - "low"
    - "info"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "output/pentest.log"
  console: true
